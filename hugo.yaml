baseURL: "https://flamti.org/"
title: "Блог Flamti"
defaultContentLanguage: ru
defaultContentLanguageInSubdir: true

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

outputs:
  home:
    - HTML
    - RSS
    - JSON

caches:
  images:
    dir: :cacheDir/images

params:
  defaultTheme: auto
  # Иконки сайта (лежат в static/, исходник — ~/Pictures/UI/soaring_ore.png)
  assets:
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    safari_pinned_tab: "safari-pinned-tab.svg"
    theme_color: "#233021"
    msapplication_TileColor: "#233021"
  # Логотип рядом с названием блога в шапке
  label:
    icon: "images/logo.png"
    iconHeight: 30
  displayFullLangName: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  comments: false

languages:
  ru:
    label: "Русский"
    locale: "ru-ru"
    weight: 1
    title: "Блог Flamti"
    menu:
      main:
        - identifier: archives
          name: Архив
          url: /ru/archives/
          weight: 10
        - identifier: search
          name: Поиск
          url: /ru/search/
          weight: 20
        - identifier: tags
          name: Теги
          url: /ru/tags/
          weight: 30

  en:
    label: "English"
    locale: "en-us"
    weight: 2
    title: "Flamti's Blog"
    menu:
      main:
        - identifier: archives
          name: Archive
          url: /en/archives/
          weight: 10
        - identifier: search
          name: Search
          url: /en/search/
          weight: 20
        - identifier: tags
          name: Tags
          url: /en/tags/
          weight: 30

  es:
    label: "Español"
    locale: "es-es"
    weight: 3
    title: "Blog de Flamti"
    menu:
      main:
        - identifier: archives
          name: Archivo
          url: /es/archives/
          weight: 10
        - identifier: search
          name: Buscar
          url: /es/search/
          weight: 20
        - identifier: tags
          name: Etiquetas
          url: /es/tags/
          weight: 30
